<!DOCTYPE html>
<html>
   <head><title>Dom Example</title></head>
   <body>
     <p id="text">Original text</p>
     <button onclick="changetext()">change text</button>
     <script>
         function changetext()
         {
            document.getElementById("text").textContent="Text changed using DOM!";
         }
     </script>

   </body>

</html>
