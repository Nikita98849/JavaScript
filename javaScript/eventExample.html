<!DOCTYPE html>
<html>
    <head><title>Event Example</title></head>
    <body>
        <i id="text"></i>
        <button onclick="disp()" >Click me</button>
        <script>
            function disp()
            {
                document.getElementById("text").innerHTML="Button Clicked"+"<br><br>";
            }
        </script>
    </body>
</html>
